# Monthly, grouped update PRs (one per ecosystem), so they arrive as a handful of PRs rather than
# one per dependency.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    # Its ref is the Rust toolchain to install (@stable, @nightly, @1.85 = the MSRV), not a
    # version of the action.
    ignore:
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /bindings/javascript
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /bindings/csharp
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]
