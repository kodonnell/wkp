name: Build and upload to PyPI (CI)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "pypi-v*.*.*"
  pull_request:
    branches: [main]

# A newer push to a pull request cancels that PR's older runs. Every other run (main, tags,
# schedule, manual) gets its own group, so it is never cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-tag:
    name: Validate release tag format
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        if: github.event_name == 'push'
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "Branch push detected; skipping tag format validation."
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^pypi-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Python tag '$TAG'. Expected format: pypi-vX.Y.Z"
            exit 1
          fi

  test-fast:
    name: Quick Python tests (source build)
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install package and dev dependencies
        run: pip install "./bindings/python[dev]"

      - name: Run tests
        run: pytest bindings/python/tests -ra -v

      # The type stubs (__init__.pyi) must match the module as installed.
      - name: Check type stubs
        working-directory: ${{ runner.temp }}
        run: python -m mypy.stubtest wkp

  build_sdist:
    name: Build source distribution
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/python

      # Build from the sdist the way pip does on platforms without a wheel.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install from sdist
        shell: bash
        run: |
          pip install bindings/python/dist/*.tar.gz
          cd "$RUNNER_TEMP" && python -c "import wkp; print(wkp.__version__, wkp.encode_floats([[1.5, 2.5]], [5, 5]))"

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  # abi3 wheels: one per platform covers every CPython from 3.10 up (including 3.14).
  build_wheels:
    name: Wheel ${{ matrix.os }} ${{ matrix.target }} ${{ matrix.manylinux }}
    needs: [validate-tag, test-fast]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: windows-latest, target: x64, manylinux: "" }
          - { os: windows-11-arm, target: aarch64, manylinux: "" }
          - { os: macos-latest, target: x86_64, manylinux: "" }
          - { os: macos-latest, target: aarch64, manylinux: "" }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Non-Docker builds (Windows/macOS) compile on the runner itself.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
          working-directory: bindings/python

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: bindings/python/dist/*.whl

  test_wheels:
    name: Test wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8
        with:
          path: wheels/
          pattern: wheels-*
          merge-multiple: true

      - name: Install wheel
        run: |
          pip install numpy shapely pytest polyline
          pip install --no-index --find-links wheels/ wkp

      # Run from the tests directory so the source tree's python/ package can't shadow the wheel.
      - name: Run tests
        working-directory: bindings/python/tests
        run: python -m pytest -ra --import-mode=importlib .

  release:
    name: Create GitHub release
    needs: [build_sdist, test_wheels]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pypi-v')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: wheels-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

  publish-test:
    name: Publish to TestPyPI
    needs: [release] # ensure there's always a release for every publish
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pypi-v')) || github.event_name == 'workflow_dispatch'
    environment:
      name: pypi
      url: https://test.pypi.org/p/wkp
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: wheels-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    name: Publish to PyPI
    needs: [publish-test]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pypi-v')) || github.event_name == 'workflow_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/p/wkp
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: wheels-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
