name: Core (Rust, C and C++) CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request cancels that PR's older runs. Every other run (main, tags,
# schedule, manual) gets its own group, so it is never cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      # All crates, including the Python/Node/WebAssembly bindings (they compile for the host).
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check versions
        run: python3 scripts/check_versions.py

      - name: Check fixture manifest
        run: python3 scripts/check_fixture_manifest.py

  # Licences, banned/duplicate crates and sources must pass. New RustSec advisories are reported
  # but don't block unrelated changes (they arrive independently of the code).
  deny:
    name: cargo deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  msrv:
    name: Minimum supported Rust (core and C ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.85

      - name: Test
        run: cargo test --locked -p wkp -p wkp-capi

  rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test (debug)
        run: cargo test --locked

      - name: Test (release)
        run: cargo test --locked --release

      - name: Benchmark
        run: cargo run --locked --release -p wkp --example bench -- 5

  cpp:
    name: C/C++ build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Not macos-latest: on its 2026-10 image, linking C++ against the macOS 27 SDK fails with
        # "tapi error: malformed file ... unknown architecture arm64e.x1" (an image fault).
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure CMake
        run: cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DWKP_BUILD_TESTS=ON -DWKP_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build/cmake --config Release

      - name: Run tests
        run: ctest --test-dir build/cmake -C Release --output-on-failure
