name: Publish the wkp crate to crates.io (CI)

# The Rust tests themselves run in core.yml; this workflow only packages and publishes.
on:
  workflow_dispatch:
  push:
    tags:
      - "crates-v*.*.*"

jobs:
  package:
    name: Package and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag format
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^crates-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid crates tag '${GITHUB_REF_NAME}'. Expected format: crates-vX.Y.Z"
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked -p wkp --release

      # Builds the crate from the packaged .crate file, so anything missing from it fails here.
      - name: Package
        run: cargo publish --locked -p wkp --dry-run

  publish:
    name: Publish to crates.io
    needs: package
    if: startsWith(github.ref, 'refs/tags/crates-v')
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: crates.io login
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked -p wkp
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
