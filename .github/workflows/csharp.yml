name: Build and publish NuGet package (CI)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "nuget-v*.*.*"
  pull_request:
    branches: [main]

# A newer push to a pull request cancels that PR's older runs. Every other run (main, tags,
# schedule, manual) gets its own group, so it is never cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-tag:
    name: Validate release tag format
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        if: github.event_name == 'push'
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "Branch push detected; skipping tag format validation."
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^nuget-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid NuGet tag '$TAG'. Expected format: nuget-vX.Y.Z"
            exit 1
          fi

  native:
    name: Native libraries
    needs: validate-tag
    uses: ./.github/workflows/native-libs.yml
    with:
      kind: capi

  test:
    name: .NET tests (${{ matrix.os }})
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Builds the native library for the runner via cargo (see Wkp.csproj).
      - name: Test
        run: dotnet test bindings/csharp/tests/Wkp.Tests -c Release

  pack:
    name: Pack NuGet package
    needs: [native, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: native-capi-*
          path: bindings/csharp/src/Wkp/runtimes
          merge-multiple: true

      - name: Pack
        run: dotnet pack bindings/csharp/src/Wkp -c Release -o artifacts/nuget -p:WkpSkipNativeBuild=true

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          listing=$(unzip -l artifacts/nuget/Wkp.*.nupkg)
          for entry in lib/net8.0/Wkp.dll \
              runtimes/linux-x64/native/libwkp_native.so runtimes/linux-arm64/native/libwkp_native.so \
              runtimes/linux-musl-x64/native/libwkp_native.so runtimes/linux-musl-arm64/native/libwkp_native.so \
              runtimes/osx-x64/native/libwkp_native.dylib runtimes/osx-arm64/native/libwkp_native.dylib \
              runtimes/win-x64/native/wkp_native.dll runtimes/win-arm64/native/wkp_native.dll; do
            grep -q " $entry$" <<<"$listing" || { echo "Package is missing $entry"; echo "$listing"; exit 1; }
          done

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg

  smoke-test:
    name: Package smoke test (${{ matrix.os }})
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: feed

      # Installs the packed package from a local feed, so the native library is resolved the
      # way it will be for real consumers.
      - name: Run a console app against the package
        shell: bash
        run: |
          set -euo pipefail
          version=$(ls feed/Wkp.*.nupkg | sed -E 's/.*Wkp\.(.*)\.nupkg/\1/')
          dotnet new console -o smoke --framework net8.0
          cd smoke
          dotnet add package Wkp --version "$version" --source ../feed
          cat > Program.cs <<'EOF'
          using Wkp;
          var coords = new[] { 38.5, -120.2, 40.7, -120.95, 43.252, -126.453 };
          var encoded = WkpCodec.Encode(GeometryType.LineString, coords, 2, 5, new[] { 1 }, new[] { 3 });
          if (encoded != "@DAA_p~iF~ps|U_ulLnnqC_mqNvxq`@") throw new System.Exception(encoded);
          System.Console.WriteLine($"ok {WkpContext.NativeVersion} {encoded}");
          EOF
          dotnet run

  # The package on Alpine (linux-musl-x64), where .NET picks the musl native library.
  smoke-test-alpine:
    name: Package smoke test (Alpine)
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: feed

      - name: Run a console app against the package in .NET's Alpine image
        run: |
          cat > smoke.sh <<'EOF'
          set -eu
          version=$(ls /feed/Wkp.*.nupkg | sed -E 's/.*Wkp\.(.*)\.nupkg/\1/')
          dotnet new console -o /tmp/smoke --framework net8.0
          cd /tmp/smoke
          dotnet add package Wkp --version "$version" --source /feed
          cat > Program.cs <<'CS'
          using Wkp;
          var coords = new[] { 38.5, -120.2, 40.7, -120.95, 43.252, -126.453 };
          var encoded = WkpCodec.Encode(GeometryType.LineString, coords, 2, 5, new[] { 1 }, new[] { 3 });
          if (encoded != "@DAA_p~iF~ps|U_ulLnnqC_mqNvxq`@") throw new System.Exception(encoded);
          System.Console.WriteLine($"ok {WkpContext.NativeVersion} {encoded}");
          CS
          dotnet run
          EOF
          docker run --rm -v "$PWD/feed:/feed" -v "$PWD/smoke.sh:/smoke.sh" \
            mcr.microsoft.com/dotnet/sdk:8.0-alpine sh /smoke.sh

  publish:
    name: Publish to NuGet
    needs: [smoke-test, smoke-test-alpine]
    if: startsWith(github.ref, 'refs/tags/nuget-v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: dist/

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # Exchanges the GitHub OIDC token for a NuGet API key that is valid for one hour.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "dist/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.nupkg
          generate_release_notes: true
