name: Build JavaScript artifacts (CI)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish in dry-run mode"
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    tags:
      - "npm-v*.*.*"
  pull_request:
    branches: [main]

# A newer push to a pull request cancels that PR's older runs. Every other run (main, tags,
# schedule, manual) gets its own group, so it is never cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-tag:
    name: Validate release tag format
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        if: github.event_name == 'push'
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "Branch push detected; skipping tag format validation."
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^npm-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid npm tag '$TAG'. Expected format: npm-vX.Y.Z"
            exit 1
          fi

  node-addons:
    name: Node addons
    needs: validate-tag
    uses: ./.github/workflows/native-libs.yml
    with:
      kind: node

  wasm:
    name: WebAssembly module
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build
        working-directory: bindings/javascript
        run: npm run build:web

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: bindings/javascript/packages/web/dist/wkp_core.wasm
          if-no-files-found: error

  js-test:
    name: JavaScript tests (${{ matrix.os }})
    needs: [node-addons, wasm]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Node addons
        uses: actions/download-artifact@v4
        with:
          pattern: native-node-*
          path: bindings/javascript/packages/node/prebuilds
          merge-multiple: true

      - name: Download WebAssembly module
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: bindings/javascript/packages/web/dist

      - name: Install
        working-directory: bindings/javascript
        run: npm ci

      - name: Test
        working-directory: bindings/javascript
        run: npm run test

      - name: Verify versions and runtime compatibility
        working-directory: bindings/javascript
        run: |
          node scripts/sync-version.mjs --check
          npm run check:runtime-compatibility

      # The published type declarations, under the strictest settings.
      - name: Type-check .d.ts files
        working-directory: bindings/javascript/packages
        run: |
          for f in node/index.d.ts web/src/index.d.ts; do
            npx --yes -p typescript@5.6.3 tsc --noEmit --strict "$f"
          done

  # The musl (Alpine) addons, in Alpine itself. The glibc addons cannot load there, so a pass also
  # shows the loader picked the musl build.
  js-test-alpine:
    name: Node tests (Alpine, ${{ matrix.arch }})
    needs: node-addons
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Download Node addons
        uses: actions/download-artifact@v4
        with:
          pattern: native-node-*
          path: bindings/javascript/packages/node/prebuilds
          merge-multiple: true

      - name: Test in node:24-alpine
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/bindings/javascript node:24-alpine \
            sh -c 'npm ci --ignore-scripts && npm run test:node'

  pack:
    name: Pack npm tarballs
    needs: [js-test, js-test-alpine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Node addons
        uses: actions/download-artifact@v4
        with:
          pattern: native-node-*
          path: bindings/javascript/packages/node/prebuilds
          merge-multiple: true

      - name: Download WebAssembly module
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: bindings/javascript/packages/web/dist

      - name: Pack
        working-directory: bindings/javascript
        run: |
          npm ci
          mkdir -p ../../artifacts/npm
          # --ignore-scripts: the prebuilt binaries above are what ships; don't rebuild in prepack.
          node packages/web/scripts/generate-version-module.mjs
          npm --workspace @wkpjs/node pack --ignore-scripts --pack-destination ../../artifacts/npm
          npm --workspace @wkpjs/web pack --ignore-scripts --pack-destination ../../artifacts/npm

      - name: Verify tarball contents
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local tarball; tarball=$(find artifacts/npm -maxdepth 1 -name "$1" | head -n 1)
            [[ -n "$tarball" ]] || { echo "Missing tarball $1"; exit 1; }
            local listing; listing=$(tar -tzf "$tarball")
            shift
            for entry in "$@"; do
              grep -qx "package/$entry" <<<"$listing" || { echo "$tarball is missing $entry"; echo "$listing"; exit 1; }
            done
          }
          check 'wkpjs-web-*.tgz' src/index.js src/index.d.ts src/version.generated.js dist/wkp_core.wasm
          check 'wkpjs-node-*.tgz' index.js index.d.ts \
            prebuilds/linux-x64/wkp.node prebuilds/linux-arm64/wkp.node \
            prebuilds/linux-x64-musl/wkp.node prebuilds/linux-arm64-musl/wkp.node \
            prebuilds/darwin-x64/wkp.node prebuilds/darwin-arm64/wkp.node \
            prebuilds/win32-x64/wkp.node prebuilds/win32-arm64/wkp.node

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: artifacts/npm/*.tgz

  release:
    name: Create GitHub release
    needs: npm-publish
    if: startsWith(github.ref, 'refs/tags/npm-v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true

  npm-publish:
    name: Publish JavaScript packages
    needs: pack
    if: startsWith(github.ref, 'refs/tags/npm-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@wkpjs'

      - name: Download tarballs
        uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: tarballs/

      # "./" makes npm read the argument as a file; "tarballs/x.tgz" alone is taken as a GitHub repo.
      # Publishing the tested tarballs (rather than re-packing) guarantees the shipped binaries
      # are exactly the ones the test matrix ran against.
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: |
          for tarball in tarballs/*.tgz; do
            npm publish "./$tarball" --access public --provenance --dry-run
          done

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/npm-v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: |
          for tarball in tarballs/*.tgz; do
            npm publish "./$tarball" --access public --provenance
          done

      - name: Trigger Pages deploy for published web package
        if: startsWith(github.ref, 'refs/tags/npm-v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const webPackagePath = path.join(process.env.GITHUB_WORKSPACE, 'bindings', 'javascript', 'packages', 'web', 'package.json');
            const webPackage = JSON.parse(fs.readFileSync(webPackagePath, 'utf8'));

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'js-published',
              client_payload: {
                web_version: webPackage.version,
              },
            });
