[package]
name = "wkp-node"
description = "Node-API addon of wkp-core for @wkpjs/node"
version.workspace = true
edition.workspace = true
# napi 3 needs a newer compiler than the rest of the workspace.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "wkp_node"
crate-type = ["cdylib"]

[dependencies]
wkp-core = { path = "../../../../../core" }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
