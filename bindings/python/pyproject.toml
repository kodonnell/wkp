[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "wkp"
description = "Well Known Polylines - fast and compact encoding of geometries to strings using the Google Polylines algorithm"
readme = "README.md"
authors = [
    {name = "kodonnell", email = "kodonnell@users.noreply.github.com"}
]
license = "MIT"
# Version comes from the Cargo workspace (Cargo.toml at the repo root).
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "shapely",
]
keywords = [
    "wkp",
    "google polyline",
    "geometry encoding",
    "geospatial",
    "geospatial encoding",
    "geospatial compression",
    "geospatial data",
    "geospatial processing",
    "geospatial analysis",
    "geospatial visualization",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/kodonnell/wkp"
"Bug Tracker" = "https://github.com/kodonnell/wkp/issues"

[project.optional-dependencies]
dev = [
    "maturin>=1.8,<2",
    "pytest",
    "polyline",
    # `python -m mypy.stubtest wkp` checks __init__.pyi against the module (run in CI).
    "mypy",
    "types-shapely",
]

# For stubtest: wkp/__init__.pyi types the public API; the implementation module behind it is not
# annotated for mypy.
[[tool.mypy.overrides]]
module = "wkp._api"
ignore_errors = true

[tool.maturin]
python-source = "python"
module-name = "wkp._core"
features = ["pyo3/extension-module"]
