[package]
name = "wkp-py"
description = "Python bindings (wkp._core) for the wkp crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
wkp = { path = "../../core" }
# abi3: one wheel per platform covers CPython 3.9 through 3.14 and later.
pyo3 = { version = "0.30", features = ["abi3-py39"] }
numpy = "0.30"
