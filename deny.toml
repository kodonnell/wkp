# cargo-deny (https://embarkstudios.github.io/cargo-deny/): licences, security advisories,
# banned or duplicated crates, and where crates come from. Checked in CI (core.yml).

[graph]
# The fuzz crate is its own workspace and is not checked here.
all-features = false

[advisories]
# RustSec advisories (vulnerabilities, unsound and unmaintained crates) fail the check.
yanked = "deny"

[licenses]
# Permissive licences only, compatible with publishing under MIT. (The LLVM exception comes from
# target-lexicon, a build-time dependency of pyo3.)
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-2-Clause", "ISC"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path (no version); none of those are published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
